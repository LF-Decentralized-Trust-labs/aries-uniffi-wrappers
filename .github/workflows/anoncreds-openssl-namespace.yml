name: '[Anoncreds]: Apple OpenSSL Namespace'

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/anoncreds-openssl-namespace.yml'
      - 'anoncreds/**'
      - 'kotlin/anoncreds/**'
      - 'scripts/namespace_anoncreds_openssl.py'
      - 'tests/openssl-namespace/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/anoncreds-openssl-namespace.yml'
      - 'anoncreds/**'
      - 'kotlin/anoncreds/**'
      - 'scripts/namespace_anoncreds_openssl.py'
      - 'tests/openssl-namespace/**'

jobs:
  validate:
    name: Validate Apple archives
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.86.0
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
          components: llvm-tools-preview

      - name: Cache cargo resources
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: anoncreds-apple-openssl-namespace
          workspaces: "anoncreds"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Verify link-order regression fixture
        run: tests/openssl-namespace/run.sh

      - name: Build and verify every published Apple KLIB
        working-directory: kotlin
        run: |
          gradle \
            :anoncreds_uniffi:compileKotlinIosArm64 \
            :anoncreds_uniffi:compileKotlinIosSimulatorArm64 \
            :anoncreds_uniffi:compileKotlinIosX64 \
            :anoncreds_uniffi:compileKotlinMacosArm64 \
            :anoncreds_uniffi:compileKotlinMacosX64

      - name: Verify Swift XCFramework build path
        run: anoncreds/build-swift-framework.sh

      - name: Upload build-environment receipts
        uses: actions/upload-artifact@v4
        with:
          name: anoncreds-openssl-namespace-receipts
          path: |
            kotlin/anoncreds/build/reports/openssl-namespace/*.json
            anoncreds/out/openssl-namespace/*.json
