name: '[Indy Besu VDR]: Kotlin Release'

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux Artifacts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kotlin

    steps:
      - uses: actions/checkout@v4

      - name: Checkout indy-besu submodule
        working-directory: .
        run: |
          ./checkout-indy-besu.sh

      - name: Set up MinGW
        run: sudo apt-get install -y mingw-w64

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android,x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu,x86_64-pc-windows-gnu

      - name: Cache cargo resources
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deps
          save-if: false
          workspaces: "indy-besu-vdr"

      - name: Install Cross
        run: | 
          cargo install cross --git https://github.com/cross-rs/cross

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up  Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Build Linux JARs
        run: |
          gradle :indy_besu_vdr:jarJvmRustRuntimeLinuxArm64Release
          gradle :indy_besu_vdr:jarJvmRustRuntimeLinuxX64Release
          gradle :indy_besu_vdr:jarJvmRustRuntimeMinGWX64Release

      - name: Upload Linux/Windows libs
        uses: actions/upload-artifact@v4
        with:
          name: indy-besu-vdr-jvm-libs
          path: kotlin/indy-besu/build/libs

      - name: Publish Android
        run: |
          gradle :indy_besu_vdr:publishAndroidReleasePublicationToGithubRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-macos:
    name: Publish to Github Repository on macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: kotlin
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout indy-besu submodule
        working-directory: .
        run: |
          ./checkout-indy-besu.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: aarch64-linux-android,aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Cache cargo resources
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: deps
          save-if: false
          workspaces: "indy-besu-vdr"
          
      - name: Set up  Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      - name: Download JVM libs
        uses: actions/download-artifact@v4
        with:
          name: indy-besu-vdr-jvm-libs
          path: kotlin/indy-besu/build/libs

      - name: Set up Java and Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Publish to Github
        run: |
          gradle :indy_besu_vdr:publishKotlinMultiplatformPublicationToGithubRepository
          gradle :indy_besu_vdr:publishJvmPublicationToGithubRepository
          gradle :indy_besu_vdr:publishMacosArm64PublicationToGithubRepository
          gradle :indy_besu_vdr:publishMacosX64PublicationToGithubRepository
          gradle :indy_besu_vdr:publishIosArm64PublicationToGithubRepository
          gradle :indy_besu_vdr:publishIosSimulatorArm64PublicationToGithubRepository
          gradle :indy_besu_vdr:publishIosX64PublicationToGithubRepository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}